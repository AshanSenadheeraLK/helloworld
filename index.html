<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World | Country Info</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-gray-100">
    <div id="app" class="container mx-auto p-4">
      <h1 class="text-4xl font-bold text-center text-blue-600 mb-6">
       Hello World | Country Information System
      </h1>
      <p class="text-center text-gray-700 mb-8">By HM Ashan Janith Dilshan Senadheera</p>
      <div id="search" class="mb-6">
        <input
          type="text"
          id="searchInput"
          placeholder="Search countries..."
          class="border rounded px-4 py-2 w-full shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
          autocomplete="off"
        />
      </div>
      <div
        id="countries"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      >
        <!-- Country Cards will be rendered here -->
      </div>
      <div id="pagination" class="mt-10 flex justify-center">
        <!-- Pagination controls will be rendered here -->
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
